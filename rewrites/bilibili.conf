# ============================================================
# Local Filters
# Maintained in qx-public
# ============================================================


# ------------------------------------------------------------
# Homepage Feed
# ------------------------------------------------------------
# 删除：广告 / 直播 / 图文 / 专栏 / < 15 分钟视频
# 过滤：关键词 / 人物 / UP 主
^https:\/\/app\.bilibili\.com\/x\/v2\/feed\/index url script-response-body https://raw.githubusercontent.com/alyxchm1/qx-public/main/scripts/bilibili/bilibili-feed-filter.js


# ------------------------------------------------------------
# Search
# ------------------------------------------------------------
# 清空搜索广场 / 搜索推荐
^https:\/\/app\.bilibili\.com\/x\/v2\/search\/square url reject-200


# ------------------------------------------------------------
# Splash Ads
# ------------------------------------------------------------
# 清空开屏广告
^https:\/\/app\.bilibili\.com\/x\/v2\/splash\/list url reject-200


# ------------------------------------------------------------
# Live
# ------------------------------------------------------------
# 删除直播 Feed 中的直播卡片 / 分区入口
^https:\/\/api\.live\.bilibili\.com\/xlive\/app-interface\/v2\/index\/feed url script-response-body https://raw.githubusercontent.com/alyxchm1/qx-public/main/scripts/bilibili/bilibili-live-filter.js


# ============================================================
# Third-Party Filters
# Source: kokoryh/Script
# ============================================================


# ------------------------------------------------------------
# Popular
# ------------------------------------------------------------
# 删除：热搜 / 广告推荐卡 / UP 主关注推荐卡
^https:\/\/(grpc\.biliapi\.net|app\.bilibili\.com)\/bilibili\.app\.show\.v1\.Popular\/Index$ url script-response-body https://raw.githubusercontent.com/kokoryh/Script/master/js/bilibili.protobuf.js


# ------------------------------------------------------------
# View
# ------------------------------------------------------------
# 删除：标题前标签 / 充电按钮 / 活动标签
^https:\/\/(grpc\.biliapi\.net|app\.bilibili\.com)\/bilibili\.app\.(view|viewunite)\.v1\.View\/(View|ViewProgress)$ url script-response-body https://raw.githubusercontent.com/kokoryh/Script/master/js/bilibili.protobuf.js


