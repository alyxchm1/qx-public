# Bilibili
# Feed filtering

#[rewrite_local]

# ============================================================
# 首页推荐流
# ============================================================

# 删除直播 / 图文 / < 15 分钟视频
^https:\/\/app\.bilibili\.com\/x\/v2\/feed\/index url script-response-body https://raw.githubusercontent.com/alyxchm1/qx-public/main/scripts/bilibili/feed-filter.js

# 关键词 / 人物 / UP 主过滤
^https:\/\/app\.bilibili\.com\/x\/v2\/feed\/index url script-response-body https://raw.githubusercontent.com/alyxchm1/qx-public/main/scripts/bilibili-keyword-filter.js


# ============================================================
# 直播 Feed
# ============================================================

# 删除直播间卡片和直播分区入口
^https:\/\/api\.live\.bilibili\.com\/xlive\/app-interface\/v2\/index\/feed url script-response-body https://raw.githubusercontent.com/alyxchm1/qx-public/main/scripts/bilibili-live-filter.js


#[mitm]
hostname = app.bilibili.com, api.live.bilibili.com